<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Document</title>
      <style>
            html, body{
                  height: 100%;
                  width: 100%;
                  margin: 0;
                  font-size: 15px;
            }
            nav{
                  height: 8%;
                  display: flex;
                  justify-content: space-around;
                  align-items: center;
                  background-color: white;
                  box-shadow: 1px 1px 5px grey;
            }
            ul{
                  display: flex;
                  gap: 30px;
                  list-style-type: none;
            }
            a{
                  text-decoration: none;
                  font-size: 1.2rem;
            }
            h2{
                  font-size: 2rem;
                  color: aqua;
                  
            }
            .main{
                  height: 200px;
                  width: 500px;
                  display: flex;
                  flex-direction: column;
                  align-items: center;
                  justify-content: center;
            }
            .container{
                  height: 92%;
                  width: 100%;
                  display: flex;
                  justify-content: center;
                  align-items: center;
            }
            button{
                  padding: 8px 20px 8px 20px;
                  font-size: 1.5rem;
                  border-radius: 10px;
                  border: 1px solid black;
                  background-color: transparent;
                  font-weight: 600;
                  color: white;
            }
            button:hover{
                  background-color: black;
            }
            
      </style>
</head>
<body>
      <nav>
            <h2>Color Flipper</h2>
            <ul>
                  <li><a href="index.html">Simple</a></li>
                  <li><a href="hex.html">HEX</a></li>
            </ul>
      </nav>
      <div class="container">
            <div class="main">
                  <h1>Background color: <span class="color" id="screencolor"></span></h1>
                  <button class="btn">Click Me</button>

      </div>

</html>
